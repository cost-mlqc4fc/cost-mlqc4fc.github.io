section_title: Latest News
heading: Find out what is happening in MLQC4FC
items:
  - image: img/resources/grants.jpg
    alt: Grant Evaluation Committee guidelines GP1
    date: Feb 2026
    title: "Grant Evaluation Committee guidelines GP1 approved"
    description: >
      The Grant Evaluation Committee guidelines GP1 have been approved.
      Read the document for the full guidelines and procedures.
      First travel period: 15/02/2026 - 14/06/2026 with deadline for submission on 15/02/2026.
      Second travel period: 15/06/2026 - 15/10/2026 with deadline for submission on 31/05/2026.
    href: docs/Grant%20Evaluation%20Committee%20guidelines%20GP1.pdf
    cta: Download Guidelines
  - image: img/events/event-school-call-2026.jpg
    alt: MLQC4FC training school call
    date: Dec 2025
    title: "Call for proposals: first MLQC4FC Training School (Sept 2026) - Deadline: 01 March 2026"
    description: >
      We invite proposals to host the first MLQC4FC Training School. The school will be aligned
      with the Action’s objectives and cover particle physics, collider physics, future colliders,
      ML4HEP, and QC4HEP. Proposals should outline the venue, dates, organizing team, and a draft
      programme.
    href: events-training.html
    cta: Learn more
  - image: img/events/event-epigraphy-2026-2.jpg
    alt: MLQC4FC at the EPIGRAPHY kick-off meeting
    date: 12-15 Jan, 2026
    title: MLQC4FC at the EPIGRAPHY kick-off
    description: >
      Presenting MLQC4FC at the EPIGRAPHY kick-off in Lisbon highlighted our shared goals,
      complementarities, and strong links between the communities. Excited for future
      collaborations.
    href: https://twitter.com/MLQC4FC/status/2013615769624494282
    cta: See post on X
  - image: img/events/event-corfu-fa-2026.jpg
    alt: Corfu Workshop on Future Accelerators
    date: 16 Apr - 26 Apr, 2026
    title: CORFU Workshop on Future Accelerators
    description: >
      The first event co-organized by MLQC4FC, focusing on future collider studies and associated
      computing challenges.
    href: https://physics.ntua.gr/corfu2026/fa.html
    cta: Learn more
